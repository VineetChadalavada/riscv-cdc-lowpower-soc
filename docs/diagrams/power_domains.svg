<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#1f2328">Power domains: what switches off, and what protects the rest</text>
  <text x="20" y="50" fill="#57606a">The same intent is written in upf/minisoc.upf. Here the cells are in the RTL, so ordinary simulation can check them.</text>

  <!-- supply rails -->
  <line x1="40" y1="84" x2="960" y2="84" stroke="#1a7f37" stroke-width="3"/>
  <text x="44" y="78" font-weight="bold" fill="#1a7f37">VDD (always on)</text>

  <!-- power switch -->
  <rect x="330" y="96" width="120" height="40" rx="5" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="390" y="114" text-anchor="middle" font-weight="bold" fill="#bc4c00">power switch</text>
  <text x="390" y="129" text-anchor="middle" fill="#57606a" font-size="11">on while pwr_on</text>
  <line x1="390" y1="84" x2="390" y2="96" stroke="#1a7f37" stroke-width="3"/>
  <line x1="120" y1="148" x2="460" y2="148" stroke="#bc4c00" stroke-width="3"/>
  <line x1="390" y1="136" x2="390" y2="148" stroke="#bc4c00" stroke-width="3"/>
  <text x="124" y="142" font-weight="bold" fill="#bc4c00">VDD_CORE (switched)</text>

  <!-- PD_CORE -->
  <rect x="100" y="160" width="380" height="170" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="114" y="180" font-weight="bold" fill="#bc4c00">PD_CORE</text>
  <rect x="140" y="194" width="250" height="110" rx="6" fill="#ffffff" stroke="#1f2328"/>
  <text x="265" y="220" text-anchor="middle" font-weight="bold" fill="#1f2328">core_p5</text>
  <text x="265" y="240" text-anchor="middle" fill="#57606a" font-size="11">state is LOST when off:</text>
  <text x="265" y="256" text-anchor="middle" fill="#57606a" font-size="11">pipeline reset on the way up,</text>
  <text x="265" y="272" text-anchor="middle" fill="#57606a" font-size="11">register file has no reset (X in sim)</text>
  <text x="265" y="292" text-anchor="middle" fill="#57606a" font-size="11">so software reboots on wake-up</text>

  <!-- isolation cells, in the always-on side -->
  <rect x="494" y="180" width="44" height="140" rx="4" fill="#ffd8b5" stroke="#bc4c00"/>
  <text x="516" y="250" text-anchor="middle" font-size="11" fill="#bc4c00" transform="rotate(-90 516 250)">iso_clamp0 × 103 bits</text>
  <line x1="390" y1="236" x2="492" y2="236" stroke="#57606a" marker-end="url(#arr)"/>
  <text x="400" y="230" fill="#57606a" font-size="11">outputs</text>
  <text x="400" y="252" fill="#cf222e" font-size="11">X when off</text>
  <line x1="538" y1="236" x2="648" y2="236" stroke="#57606a" marker-end="url(#arr)"/>
  <text x="546" y="230" fill="#57606a" font-size="11">clamped</text>
  <text x="546" y="252" fill="#1a7f37" font-size="11">clean 0</text>

  <!-- AON logic -->
  <rect x="650" y="160" width="320" height="170" rx="8" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="664" y="180" font-weight="bold" fill="#1a7f37">PD_AON</text>
  <text x="664" y="204" fill="#1f2328">RAM (program survives), bridge, UART,</text>
  <text x="664" y="222" fill="#1f2328">timer (the wake-up source), counters</text>
  <rect x="664" y="244" width="292" height="70" rx="6" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="810" y="266" text-anchor="middle" font-weight="bold" fill="#8250df">pmu: power controller</text>
  <text x="810" y="284" text-anchor="middle" fill="#57606a" font-size="11">drives pwr_on, iso_en, clk_en, reset</text>
  <text x="810" y="300" text-anchor="middle" fill="#57606a" font-size="11">wakes on the timer interrupt</text>

  <!-- ICG -->
  <rect x="140" y="354" width="90" height="34" rx="4" fill="#ffffff" stroke="#1f2328"/>
  <text x="185" y="376" text-anchor="middle" fill="#1f2328">ICG</text>
  <line x1="185" y1="354" x2="185" y2="306" stroke="#57606a" marker-end="url(#arr)"/>
  <text x="191" y="336" fill="#57606a" font-size="11">gclk</text>
  <line x1="60" y1="371" x2="138" y2="371" stroke="#57606a" marker-end="url(#arr)"/>
  <text x="62" y="364" fill="#57606a" font-size="11">clk_core</text>

  <!-- control from PMU -->
  <path d="M 700 314 L 700 420 L 185 420 L 185 390" stroke="#8250df" fill="none" marker-end="url(#arrP)"/>
  <text x="300" y="414" fill="#8250df" font-size="11">clk_en</text>
  <path d="M 760 314 L 760 436 L 330 436 L 330 306" stroke="#8250df" fill="none" marker-end="url(#arrP)"/>
  <text x="340" y="432" fill="#8250df" font-size="11">core reset</text>
  <path d="M 820 314 L 820 452 L 516 452 L 516 322" stroke="#8250df" fill="none" marker-end="url(#arrP)"/>
  <text x="530" y="448" fill="#8250df" font-size="11">iso_en</text>
  <path d="M 880 244 L 880 116 L 452 116" stroke="#8250df" fill="none" marker-end="url(#arrP)"/>
  <text x="600" y="110" fill="#8250df" font-size="11">pwr_on</text>
</svg>
