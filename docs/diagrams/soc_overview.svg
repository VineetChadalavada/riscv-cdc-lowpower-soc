<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>
  <rect width="1040" height="660" fill="#ffffff"/>

  <text x="20" y="30" font-size="18" font-weight="bold" fill="#1f2328">minisoc: block diagram</text>
  <text x="20" y="50" fill="#57606a">Two unrelated clocks, two power domains. Everything that crosses a clock boundary goes through a verified CDC block (red dots).</text>

  <!-- always-on domain: the whole chip -->
  <rect x="20" y="68" width="1000" height="548" rx="10" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="34" y="88" font-weight="bold" fill="#1a7f37">PD_AON: always on</text>

  <!-- clock domain boundary -->
  <line x1="640" y1="96" x2="640" y2="606" stroke="#6e7781" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="628" y="110" text-anchor="end" font-weight="bold" fill="#57606a">clk_core (10 ns)</text>
  <text x="652" y="110" font-weight="bold" fill="#57606a">clk_periph (27 ns)</text>

  <!-- ===================== core power domain ===================== -->
  <rect x="40" y="124" width="232" height="140" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="52" y="143" font-weight="bold" fill="#bc4c00">PD_CORE: switchable</text>
  <rect x="56" y="154" width="176" height="92" rx="6" fill="#ffffff" stroke="#1f2328"/>
  <text x="144" y="182" text-anchor="middle" font-weight="bold" fill="#1f2328">core_p5</text>
  <text x="144" y="200" text-anchor="middle" fill="#57606a">RV32I, 5-stage pipeline</text>
  <text x="144" y="216" text-anchor="middle" fill="#57606a">(TinyTrust core, reused)</text>
  <text x="144" y="234" text-anchor="middle" fill="#57606a" font-size="11">timer irq in ↓ from sync</text>
  <!-- isolation strip -->
  <rect x="264" y="150" width="18" height="100" fill="#ffd8b5" stroke="#bc4c00"/>
  <text x="273" y="200" text-anchor="middle" font-size="10" fill="#bc4c00" transform="rotate(-90 273 200)">isolation, clamp 0</text>

  <!-- ICG and PMU -->
  <rect x="96" y="286" width="96" height="30" rx="4" fill="#ffffff" stroke="#1f2328"/>
  <text x="144" y="306" text-anchor="middle" fill="#1f2328">ICG</text>
  <line x1="144" y1="286" x2="144" y2="248" stroke="#57606a" marker-end="url(#arr)"/>
  <text x="150" y="274" fill="#57606a" font-size="11">gclk</text>
  <line x1="30" y1="301" x2="94" y2="301" stroke="#57606a" marker-end="url(#arr)"/>
  <text x="34" y="296" fill="#57606a" font-size="11">clk_core</text>

  <rect x="40" y="344" width="232" height="96" rx="6" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="156" y="366" text-anchor="middle" font-weight="bold" fill="#8250df">pmu: power controller</text>
  <text x="156" y="384" text-anchor="middle" fill="#57606a">0x3000_0000</text>
  <text x="156" y="402" text-anchor="middle" fill="#57606a" font-size="11">sleep: isolate, clock off, reset, power off</text>
  <text x="156" y="418" text-anchor="middle" fill="#57606a" font-size="11">wake: power on, clock on, release, un-isolate</text>
  <!-- PMU control lines -->
  <path d="M 60 344 L 60 266" stroke="#8250df" fill="none" marker-end="url(#arrP)"/>
  <text x="64" y="336" fill="#8250df" font-size="11">pwr_on, rst_n</text>
  <path d="M 144 344 L 144 318" stroke="#8250df" fill="none" marker-end="url(#arrP)"/>
  <text x="150" y="336" fill="#8250df" font-size="11">clk_en</text>
  <path d="M 256 344 L 256 330 L 273 330 L 273 252" stroke="#8250df" fill="none" marker-end="url(#arrP)"/>
  <text x="200" y="336" fill="#8250df" font-size="11">iso_en</text>

  <!-- ===================== data bus / decode ===================== -->
  <rect x="316" y="124" width="30" height="330" rx="4" fill="#ddf4ff" stroke="#0969da"/>
  <text x="331" y="290" text-anchor="middle" fill="#0969da" font-size="11" transform="rotate(-90 331 290)">address decode</text>
  <line x1="282" y1="176" x2="314" y2="176" stroke="#57606a" marker-end="url(#arr)"/>
  <text x="286" y="170" fill="#57606a" font-size="11">imem</text>
  <line x1="282" y1="226" x2="314" y2="226" stroke="#57606a" marker-end="url(#arr)"/>
  <text x="286" y="220" fill="#57606a" font-size="11">dmem</text>
  <line x1="316" y1="392" x2="274" y2="392" stroke="#57606a" marker-end="url(#arr)"/>

  <!-- slaves in clk_core -->
  <rect x="376" y="124" width="200" height="56" rx="6" fill="#ffffff" stroke="#1f2328"/>
  <text x="476" y="146" text-anchor="middle" font-weight="bold" fill="#1f2328">tcm: 16 KiB RAM</text>
  <text x="476" y="164" text-anchor="middle" fill="#57606a">0x0000_0000, program + data</text>
  <line x1="346" y1="152" x2="374" y2="152" stroke="#57606a" marker-end="url(#arr)"/>

  <rect x="376" y="196" width="200" height="56" rx="6" fill="#ffffff" stroke="#1f2328"/>
  <text x="476" y="218" text-anchor="middle" font-weight="bold" fill="#1f2328">perf_counters</text>
  <text x="476" y="236" text-anchor="middle" fill="#57606a">0x2000_0000, cycles, latency, sleep</text>
  <line x1="346" y1="224" x2="374" y2="224" stroke="#57606a" marker-end="url(#arr)"/>

  <!-- ===================== bridge across the boundary ===================== -->
  <rect x="376" y="276" width="600" height="150" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="390" y="296" font-weight="bold" fill="#8250df">cdc_apb_bridge (0x1000_0000)</text>
  <line x1="346" y1="330" x2="386" y2="330" stroke="#57606a" marker-end="url(#arr)"/>

  <rect x="388" y="310" width="150" height="100" rx="6" fill="#ffffff" stroke="#1f2328"/>
  <text x="463" y="332" text-anchor="middle" font-weight="bold" fill="#1f2328">core side</text>
  <text x="463" y="352" text-anchor="middle" fill="#57606a" font-size="11">push request once</text>
  <text x="463" y="370" text-anchor="middle" fill="#57606a" font-size="11">wait for response</text>
  <text x="463" y="388" text-anchor="middle" fill="#57606a" font-size="11">registered response</text>

  <rect x="570" y="312" width="140" height="36" rx="5" fill="#ffffff" stroke="#cf222e"/>
  <text x="640" y="334" text-anchor="middle" fill="#1f2328">request async FIFO →</text>
  <rect x="570" y="366" width="140" height="36" rx="5" fill="#ffffff" stroke="#cf222e"/>
  <text x="640" y="388" text-anchor="middle" fill="#1f2328">← response async FIFO</text>
  <line x1="538" y1="330" x2="568" y2="330" stroke="#57606a" marker-end="url(#arr)"/>
  <line x1="570" y1="384" x2="540" y2="384" stroke="#57606a" marker-end="url(#arr)"/>
  <circle cx="640" cy="312" r="5" fill="#cf222e"/>
  <circle cx="640" cy="402" r="5" fill="#cf222e"/>

  <rect x="744" y="310" width="210" height="100" rx="6" fill="#ffffff" stroke="#1f2328"/>
  <text x="849" y="332" text-anchor="middle" font-weight="bold" fill="#1f2328">APB master</text>
  <text x="849" y="352" text-anchor="middle" fill="#57606a" font-size="11">IDLE → SETUP → ACCESS</text>
  <text x="849" y="370" text-anchor="middle" fill="#57606a" font-size="11">waits while PREADY is low</text>
  <line x1="710" y1="330" x2="742" y2="330" stroke="#57606a" marker-end="url(#arr)"/>
  <line x1="744" y1="384" x2="712" y2="384" stroke="#57606a" marker-end="url(#arr)"/>

  <!-- ===================== APB peripherals ===================== -->
  <line x1="849" y1="410" x2="849" y2="446" stroke="#0969da" stroke-width="2" marker-end="url(#arr)"/>
  <text x="856" y="434" fill="#0969da" font-size="11">APB</text>
  <rect x="744" y="448" width="210" height="30" rx="4" fill="#ddf4ff" stroke="#0969da"/>
  <text x="849" y="468" text-anchor="middle" fill="#0969da">apb_decoder (unmapped → error)</text>

  <rect x="684" y="508" width="150" height="56" rx="6" fill="#ffffff" stroke="#1f2328"/>
  <text x="759" y="530" text-anchor="middle" font-weight="bold" fill="#1f2328">apb_uart_tx</text>
  <text x="759" y="548" text-anchor="middle" fill="#57606a" font-size="11">0x1000_0000</text>
  <rect x="850" y="508" width="150" height="56" rx="6" fill="#ffffff" stroke="#1f2328"/>
  <text x="925" y="530" text-anchor="middle" font-weight="bold" fill="#1f2328">apb_timer</text>
  <text x="925" y="548" text-anchor="middle" fill="#57606a" font-size="11">0x1000_1000</text>
  <line x1="800" y1="478" x2="780" y2="506" stroke="#0969da" marker-end="url(#arr)"/>
  <line x1="900" y1="478" x2="920" y2="506" stroke="#0969da" marker-end="url(#arr)"/>
  <line x1="759" y1="564" x2="759" y2="636" stroke="#57606a" marker-end="url(#arr)"/>
  <text x="766" y="630" fill="#57606a" font-size="11">uart_tx pin</text>

  <!-- ===================== timer interrupt back to the core ===================== -->
  <path d="M 925 564 L 925 590 L 560 590" stroke="#bc4c00" stroke-width="1.5" fill="none" marker-end="url(#arrR)"/>
  <text x="860" y="584" fill="#bc4c00" font-size="11">timer irq (a level, from a flop)</text>
  <circle cx="640" cy="590" r="5" fill="#cf222e"/>
  <rect x="470" y="576" width="90" height="28" rx="4" fill="#ffffff" stroke="#cf222e"/>
  <text x="515" y="595" text-anchor="middle" fill="#1f2328">sync_2ff</text>
  <path d="M 470 590 L 200 590 L 200 442" stroke="#bc4c00" stroke-width="1.5" fill="none" marker-end="url(#arrR)"/>
  <text x="300" y="584" fill="#bc4c00" font-size="11">wakes the PMU, interrupts the core</text>

  <!-- resets -->
  <rect x="376" y="470" width="150" height="46" rx="6" fill="#ffffff" stroke="#1f2328"/>
  <text x="451" y="490" text-anchor="middle" font-weight="bold" fill="#1f2328">rst_sync × 2</text>
  <text x="451" y="506" text-anchor="middle" fill="#57606a" font-size="11">one per clock domain</text>
  <line x1="300" y1="493" x2="374" y2="493" stroke="#57606a" marker-end="url(#arr)"/>
  <text x="300" y="486" fill="#57606a" font-size="11">arst_n pin</text>

  <!-- legend -->
  <circle cx="44" cy="636" r="5" fill="#cf222e"/>
  <text x="54" y="640" fill="#57606a" font-size="11">clock-domain crossing</text>
  <rect x="190" y="629" width="14" height="14" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="210" y="640" fill="#57606a" font-size="11">switchable power domain</text>
  <rect x="370" y="629" width="14" height="14" fill="#f0fff4" stroke="#1a7f37"/>
  <text x="390" y="640" fill="#57606a" font-size="11">always-on power domain</text>
  <line x1="530" y1="636" x2="560" y2="636" stroke="#8250df"/>
  <text x="566" y="640" fill="#57606a" font-size="11">power control</text>
</svg>
