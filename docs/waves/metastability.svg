<text x="12" y="22" font-size="15" font-weight="bold" fill="#1f2328" font-family="Segoe UI, Helvetica, Arial, sans-serif">Why multi-bit values cross as Gray code</text>
<text x="12" y="40" font-size="12" fill="#57606a" font-family="Segoe UI, Helvetica, Arial, sans-serif">From tb_cdc_prims, metastability model on. A counter crosses twice. The binary copy jumps back from 37 to 35: a mix of old and new bits. The Gray copy only ever moves forward.</text>
